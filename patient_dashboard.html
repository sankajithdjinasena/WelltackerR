<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Dashboard | HealthTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container py-4">
    <h2 class="mb-4">Welcome, [Patient Name]</h2>

    <!-- Add Vitals Form -->
    <div class="card p-3 mb-4">
      <h4>Add Daily Vitals</h4>
      <form>
        <div class="row g-3">
          <div class="col-md-3"><input type="number" class="form-control" placeholder="Blood Pressure"></div>
          <div class="col-md-3"><input type="number" class="form-control" placeholder="Sugar Level"></div>
          <div class="col-md-3"><input type="number" class="form-control" placeholder="Heart Rate"></div>
          <div class="col-md-3"><input type="number" class="form-control" placeholder="Weight"></div>
        </div>
        <div class="mt-3"><button class="btn btn-primary">Save</button></div>
      </form>
    </div>

    <!-- Charts -->
    <div class="row">
      <div class="col-md-6">
        <canvas id="bpChart"></canvas>
      </div>
      <div class="col-md-6">
        <canvas id="sugarChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Blood Pressure Chart
    new Chart(document.getElementById("bpChart"), {
      type: "line",
      data: {
        labels: ["Day 1", "Day 2", "Day 3", "Day 4", "Day 5", "Day 6", "Day 7",],
        datasets: [{
          label: "Blood Pressure",
          data: [120, 125, 118, 130, 122, 128,145],
          borderColor: "blue",
          fill: false
        }]
      }
    });

    // Sugar Level Chart
    new Chart(document.getElementById("sugarChart"), {
      type: "line",
      data: {
        labels: ["Day 1", "Day 2", "Day 3", "Day 4"],
        datasets: [{
          label: "Sugar Level",
          data: [90, 100, 95, 105],
          borderColor: "green",
          fill: false
        }]
      }
    });
  </script>
</body>
</html>
