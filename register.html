<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WelltrackeR | Register</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" type="image/png" href="image/Logo_R.png">
    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="nav-header">
            <div class="nav-logo"><img src="image/Logo_R.png" alt="Logo"></div>
            <div class="nav-title">
                <h1>WellTrackeR</h1>
            </div>
        </div>

        <!-- Hamburger Menu -->
        <i class='bx bx-menu menu-toggle'></i>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="patient_portal.html" class="login-btn" >Login</a>
            <a href="register.html" class="register-btn" id="active">Register</a>
        </div>
    </nav>

    <!-- Login Form -->
    <section class="login-contact-section">
        <div class="login-contact-grid">
            <div class="login-contact-form">
                <h3>Create an Account</h3>
                <p>Please fill in your details to register.</p>
                <form>
                    <div class="login-form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="Enter first name" required>
                    </div>
                    <div class="login-form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Enter last name" required>
                    </div>
                    <div class="login-form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Enter your email" required>
                    </div>
                    <div class="login-form-group">
                        <label>Password</label>
                        <input type="password" placeholder="Enter password" required>
                    </div>
                    <div class="login-form-group">
                        <label>Confirm Password</label>
                        <input type="password" placeholder="Confirm password" required>
                    </div>
                    <button type="submit" class="login-submit-btn">Register <i class="bx bx-user-plus"></i></button>
                </form>
                <center>
                    <p style="margin-top:15px;font-size:14px;">Already have an account?
                        <a href="login.html" style="color:#16a085;font-weight:600;">Login</a>
                    </p>
                </center>
            </div>
            <div class="login-contact-form">


            </div>
        </div>
    </section>


    <!-- Footer -->
    <footer>
        <div class="social">
            <h2>Follow us</h2>
            <div class="social-media">
                <a href="#"> <i class='bx bxl-facebook'></i></a>
                <a href="#"> <i class='bx bxl-instagram'></i></a>
                <a href="#"> <i class='bx bxl-twitter'></i></a>
            </div>
        </div>

        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="contact.html">Contact Us</a>
        </div>
        <p>&copy; 2025 WellTrackeR. All rights reserved.</p>
    </footer>

</body>
<script src="js/script.js"></script>

</html>
